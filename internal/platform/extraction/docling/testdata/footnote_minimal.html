<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Footnote v3</title>
<style>
  body { font-family: Georgia, serif; line-height: 1.5; margin: 2cm; }
  sup a { text-decoration: none; }
  .footnotes hr { border: none; border-top: 1px solid #999; width: 30%; margin-left: 0; }
  .footnotes p { font-size: 0.75em; margin: 0.3em 0; }
</style>
</head>
<body>

<p>A minimal document with a single footnote reference<sup><a href="#fn1">1</a></sup>
and nothing else on the page besides the footnote block itself.</p>

<div class="footnotes">
  <hr>
  <p id="fn1"><sup>1</sup> This is the only footnote.</p>
</div>

</body>
</html>
