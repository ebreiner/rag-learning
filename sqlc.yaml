version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/insert/query/query.sql"
    schema: "internal/db/schema/sqlc_schema.sql"
    gen:
      go:
        package: "query"
        out: "internal/db/insert/query"
        emit_prepared_queries: true

  - engine: "sqlite"
    queries: "internal/db/retrieve/query/query.sql"
    schema: "internal/db/schema/sqlc_schema.sql"
    gen:
      go:
        package: "retrieve"
        out: "internal/db/retrieve/query"
